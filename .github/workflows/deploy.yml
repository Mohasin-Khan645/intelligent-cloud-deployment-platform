name: Build and Deploy

concurrency:
  group: production-deployment
  cancel-in-progress: false

on:
  push:
    branches:
      - main

  workflow_dispatch:    

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: intelligent-cloud-demo-app
  ECS_CLUSTER: intelligent-cloud-cluster
  ECS_SERVICE: intelligent-demo-service
  CONTAINER_NAME: demo-app

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/demo-app/package-lock.json

      # ----------------------------------------
      # 3. Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        working-directory: application/demo-app
        run: npm ci

      # ----------------------------------------
      # 4. Run tests
      # ----------------------------------------
      - name: Run tests
        working-directory: application/demo-app
        run: npm test

      # ----------------------------------------
      # 5. Configure AWS using GitHub OIDC
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::688674375439:role/GitHubActionsDeploymentRole
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------
      # 5.1 Display deployment context
      # ----------------------------------------
      - name: Display deployment context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Workflow: $GITHUB_WORKFLOW"

      # ----------------------------------------
      # 6. Login to Amazon ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------
      # 7. Build Docker image
      # ----------------------------------------
      - name: Build Docker image
        working-directory: application/demo-app
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      # ----------------------------------------
      # 8. Push Docker image to ECR
      # ----------------------------------------
      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Checking whether image already exists in ECR..."

          EXISTING_TAG=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'images[0].imageId.imageTag' \
            --output text 2>/dev/null || true)

          if [ "$EXISTING_TAG" = "$IMAGE_TAG" ]; then
            echo "Image already exists in ECR."
            echo "Skipping push because ECR tags are immutable."
            echo "Image: $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          else
            echo "Image does not exist in ECR."
            echo "Pushing image..."
            docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          fi

      # ----------------------------------------
      # 9. Download current ECS task definition
      # ----------------------------------------
      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition intelligent-cloud-demo-app \
            --query taskDefinition \
            --output json > task-definition.json

      # ----------------------------------------
      # 10. Update container image
      # ----------------------------------------
      - name: Render new ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # ----------------------------------------
      # 11. Deploy to ECS
      # ----------------------------------------
      - name: Deploy to Amazon ECS
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
          max-retries: 3


      - name: Verify ECS deployment
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          ECS_SERVICE: ${{ env.ECS_SERVICE }}
        run: |
          echo "Checking ECS service state..."

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount,TaskDefinition:taskDefinition,Deployments:deployments[*].{Status:status,TaskDefinition:taskDefinition,Desired:desiredCount,Running:runningCount,Pending:pendingCount,Failed:failedTasks,RolloutState:rolloutState,RolloutReason:rolloutStateReason}}' \
          --output table

      # ----------------------------------------
      # 12. Deployment completed
      # ----------------------------------------
      - name: Deployment successful
        run: |
          echo "Deployment completed successfully."
          echo "Commit: $GITHUB_SHA"
          echo "ECR Image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"